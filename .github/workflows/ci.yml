# CI común (METODOLOGIA.md §8). Corre en cada PR y en cada push a main. El título del PR lo
# comprueba pr-titulo.yml, aparte, para que editarlo no relance ni tape esta verificación.
#   · secretos con gitleaks, solo en los commits nuevos
#   · deploy/ válido si el proyecto es instalable (CONVENTION.md)
#   · scripts/check.sh: lint, tests y build del proyecto. Es el mismo comando que se
#     ejecuta en local antes de abrir el PR, así que local y CI no pueden discrepar.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proyecto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secretos (gitleaks, solo commits nuevos)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          rango=()
          if [[ -n $BASE && ! $BASE =~ ^0+$ ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            rango=(--log-opts="$BASE..HEAD")
          fi
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git . --redact --no-banner "${rango[@]}"

      - name: deploy/ (convención dockers)
        if: hashFiles('deploy/compose.yml') != ''
        run: |
          DOMAIN=ci.example TZ=UTC VM_IP=127.0.0.1 DATA_DIR=/tmp/data APP_VERSION=0.0.0 \
            docker compose -f deploy/compose.yml --env-file deploy/.env.example --profile migrate config -q

      # check.sh y test-modules.py solo necesitan Python con PyYAML (sin él, test-modules.py se
      # salta la validación de YAML y la CI no comprobaría lo mismo que en local).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Dependencias de check.sh
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.2

      - name: scripts/check.sh
        run: ./scripts/check.sh
